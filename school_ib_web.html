*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .2s,color .2s}button{font:inherit;cursor:pointer;border:0}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.shell{max-width:1200px;margin:auto;padding:0 24px}.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}.nav{height:76px;display:flex;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.3px;margin-right:auto}.brandmark{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;color:var(--accent);background:var(--accent2);font-size:22px}.navlinks{display:flex;gap:5px}.navlinks button,.ghost{background:transparent;color:var(--muted);padding:10px 13px;border-radius:12px}.navlinks button:hover,.ghost:hover{background:var(--accent2);color:var(--accent)}.hero{padding:48px 0 30px;display:grid;grid-template-columns:1.3fr .7fr;gap:26px;align-items:center}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}.hero h1{font-size:clamp(34px,5vw,57px);line-height:1.08;letter-spacing:-1.9px;margin:13px 0 17px;max-width:760px}.hero p{font-size:18px;color:var(--muted);max-width:660px;margin:0 0 24px}.heroart{border-radius:32px;background:linear-gradient(145deg,var(--accent2),var(--card));min-height:270px;display:grid;place-items:center;border:1px solid var(--border);overflow:hidden;position:relative}.shield{width:150px;height:170px;clip-path:polygon(50% 0,93% 16%,86% 68%,50% 100%,14% 68%,7% 16%);background:var(--accent);display:grid;place-items:center;color:white;font-size:64px;box-shadow:var(--shadow)}.orb{position:absolute;border-radius:50%;background:var(--accent);opacity:.13}.orb.a{width:190px;height:190px;top:-50px;right:-25px}.orb.b{width:100px;height:100px;bottom:-25px;left:20px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border-radius:13px;padding:12px 17px;font-weight:750;transition:transform .15s,box-shadow .15s}.btn:hover{transform:translateY(-1px)}.primary{background:var(--accent);color:#fff;box-shadow:0 7px 17px color-mix(in srgb,var(--accent) 22%,transparent)}.secondary{background:var(--accent2);color:var(--accent)}.outline{background:var(--card);color:var(--text);border:1px solid var(--border)}.section{padding:24px 0 42px}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:17px}.section h2{font-size:27px;letter-spacing:-.6px;margin:0}.sub{color:var(--muted);margin:5px 0 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:22px;box-shadow:var(--shadow);min-width:0}.card h3{font-size:18px;line-height:1.3;margin:12px 0 8px}.card p{color:var(--muted);margin:0 0 15px}.iconbox{width:46px;height:46px;display:grid;place-items:center;border-radius:15px;background:var(--accent2);color:var(--accent);font-size:22px;font-weight:800}.cardfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}.pill{display:inline-flex;align-items:center;border-radius:999px;background:var(--accent2);color:var(--accent);font-size:12px;font-weight:800;padding:5px 10px}.featureband{background:var(--accent2);border:1px solid var(--border);border-radius:25px;padding:25px;display:flex;justify-content:space-between;gap:20px;align-items:center}.featureband h3{margin:0 0 5px;font-size:22px}.featureband p{margin:0;color:var(--muted)}.page{padding:30px 0 65px}.back{margin-bottom:18px}.pagehead{margin:0 0 24px}.pagehead h1{font-size:clamp(29px,4vw,42px);line-height:1.15;letter-spacing:-1px;margin:7px 0}.pagehead p{color:var(--muted);margin:0}.olympiad-list{display:grid;gap:13px}.olympiad-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px}.olympiad-row h3{margin:0 0 7px;font-size:20px}.olympiad-row p{margin:0;color:var(--muted)}.rowactions{display:flex;flex-direction:column;gap:8px;min-width:205px}.rowactions .btn{font-size:13px}.classgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.classcard{padding:27px;display:flex;flex-direction:column;min-height:260px}.classnum{font-size:43px;letter-spacing:-1px;color:var(--accent);font-weight:850}.classcard p{flex:1}.question{margin:15px 0;padding:23px}.qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.qtop .eyebrow{margin-right:auto}.question h3{font-size:20px;line-height:1.4;margin:0 0 18px}.option{border:1px solid var(--border);background:var(--bg);border-radius:14px;padding:14px 16px;margin:9px 0;display:grid;grid-template-columns:1fr;gap:8px}.option.correct{background:var(--goodbg);border-color:#9ed8b7}.option.wrong{background:var(--badbg);border-color:#f0c6ca}.optiontop{display:flex;gap:10px;align-items:flex-start}.status{font-size:11px;font-weight:850;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}.option.correct .status{color:var(--good)}.option.wrong .status{color:var(--bad)}.optiontext{font-weight:700}.optionnote{color:var(--muted);font-size:14px}.explain{margin-top:16px;padding:17px 18px;background:color-mix(in srgb,var(--accent2) 48%,var(--card));border:1px solid var(--border);border-radius:15px}.explain strong{display:block;color:var(--accent);font-size:11px;letter-spacing:1px;margin-bottom:5px}.quizoption{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--border);border-radius:14px;margin:9px 0;background:var(--bg)}.quizoption input{accent-color:var(--accent);margin-top:5px}.feedback{padding:15px;border-radius:14px;background:var(--accent2);margin-top:14px}.empty{padding:35px;text-align:center}.empty .iconbox{margin:0 auto 14px}.settingsrow{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:17px 0;border-bottom:1px solid var(--border)}.swatches{display:flex;gap:9px}.swatch{width:37px;height:37px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--border)}.swatch[aria-pressed=true]{box-shadow:0 0 0 3px var(--text)}footer{padding:28px 0;border-top:1px solid var(--border);color:var(--muted);font-size:13px}.mobilemenu{display:none} @media(max-width:850px){.hero{grid-template-columns:1fr}.heroart{min-height:200px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.navlinks{display:none}.mobilemenu{display:block}.olympiad-row{grid-template-columns:1fr}.rowactions{flex-direction:row;flex-wrap:wrap}.rowactions .btn{flex:1}.featureband{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.shell{padding:0 15px}.nav{height:65px}.brand{font-size:14px}.brandmark{width:37px;height:37px}.hero{padding:32px 0 20px}.heroart{min-height:170px}.shield{width:110px;height:128px;font-size:48px}.grid,.classgrid{grid-template-columns:1fr}.card{padding:18px}.sectionhead{align-items:flex-start;flex-direction:column}.page{padding-top:20px}.classcard{min-height:220px}.question{padding:16px}.question h3{font-size:18px}.settingsrow{align-items:flex-start;flex-direction:column}.rowactions{flex-direction:column}.rowactions .btn{width:100%}}

<script>
const DATA={"DEMO_OLYMPIADS":[["vsosh","ВсОШ по информационной безопасности","Криптография, веб, форензика, сети","⌘"],["innopolis","Международная олимпиада Иннополис","Практические задачи по кибербезопасности","⌁"],["verchenko","Олимпиада имени И. Я. Верченко","Информатика, алгоритмы и компьютерная безопасность","∑"],["vysshaya_engineering","«Высшая проба» — инженерные науки","Физика, логика и технические системы","⚙"],["step_future","«Шаг в будущее» — инженерное дело","Предметные задачи и проектное мышление","⚒"]],"DEMO_QUESTIONS":{"vsosh":[["Криптография","Сообщение зашифровано XOR с одним и тем же байтом. Что верно о повторном применении того же XOR-ключа?",["Получится исходное сообщение","Сообщение станет длиннее","Ключ автоматически изменится","Данные будут сжаты"],0,"При XOR одинаковые биты дают 0, разные — 1. Если повторить XOR с тем же ключом, второй проход отменит первый: (x XOR k) XOR k = x. Поэтому вернётся исходное сообщение."],["Веб-безопасность","Какой подход лучше всего снижает риск SQL-инъекции?",["Скрыть адрес сайта","Использовать параметризованные запросы","Переименовать таблицу","Увеличить длину URL"],1,"Запрос и пользовательские данные передаются отдельно. Поэтому введённый текст обрабатывается как значение, а не как команда SQL — это и снижает риск инъекции."],["Форензика","В файле обнаружена строка с флагом, но расширение файла неизвестно. Какой безопасный первый шаг?",["Сразу запустить файл","Удалить файл","Определить тип файла и изучить его копию","Отправить всем знакомым"],2,"Сначала определяют формат и работают с копией в изолированной среде."],["Сети","Какой формат обычно используют для сохранения захваченного сетевого трафика?",["PCAP","PNG","MP3","DOCX"],0,"PCAP/PCAPNG хранит пакеты для последующего анализа."],["Linux","Какая команда показывает текущий рабочий каталог в Linux?",["pwd","cd..","whereis all","showdir"],0,"pwd выводит путь текущего рабочего каталога."]],"innopolis":[["Анализ файлов","Какой признак наиболее полезен для первичной проверки неизвестного файла?",["Цвет иконки","Хеш-сумма и тип файла","Имя владельца компьютера","Размер монитора"],1,"Хеш — цифровой отпечаток файла: по нему можно сравнивать копии и искать совпадения. Тип файла показывает, как устроены данные. Неизвестный файл не следует запускать до проверки."],["Криптография","В шифре Цезаря каждая буква сдвигается на фиксированное число позиций. Сколько вариантов сдвига достаточно проверить для латинского алфавита?",["2","10","25","100"],2,"В латинском алфавите 26 букв. Сдвиг на 0 ничего не меняет, поэтому остаётся 25 ненулевых сдвигов. Их можно проверить по очереди и найти осмысленный текст."],["Безопасность ОС","Зачем программам назначают минимально необходимые права?",["Чтобы уменьшить последствия компрометации","Чтобы ускорить интернет","Чтобы увеличить экран","Чтобы скрыть расширения"],0,"Принцип наименьших привилегий ограничивает доступ при ошибке или взломе."],["Сети","Что может подсказать необычно большое число запросов к одному порту?",["Возможное сканирование","Низкий заряд мыши","Сжатие изображения","Изменение языка"],0,"Множество запросов к разным портам или адресам может быть признаком сканирования; нужен контекст."],["Веб","Какой заголовок помогает запретить браузеру встраивать страницу в frame на чужом сайте?",["X-Frame-Options","Content-Length","Accept-Language","Date"],0,"X-Frame-Options или CSP frame-ancestors помогают ограничить встраивание страницы."]],"verchenko":[["Логика","Если все A — B, а ни один B не является C, может ли объект A быть C?",["Да, всегда","Нет","Только если A нечётное","Недостаточно данных о цвете"],1,"По условию каждый объект A обязательно является B. При этом ни один B не относится к C. Значит, объект A не может одновременно быть C."],["Алгоритмы","Какова сложность бинарного поиска в отсортированном массиве из n элементов?",["O(1)","O(log n)","O(n²)","O(2ⁿ)"],1,"Сначала проверяется середина отсортированного массива. Затем остаётся только левая или правая половина. После каждого шага элементов примерно вдвое меньше, поэтому число шагов растёт как log₂(n)."],["Двоичная система","Чему равно двоичное число 1011 в десятичной системе?",["9","10","11","13"],2,"1011₂ = 8 + 2 + 1 = 11."],["Безопасность","Почему нельзя хранить пароль в базе данных в открытом виде?",["Он занимает много места","При утечке пароль сразу станет известен","Он перестанет работать","База станет медленнее всегда"],1,"Следует хранить стойкий парольный хеш с солью, используя специализированный алгоритм."],["Математика","Какое число простое?",["21","27","29","39"],2,"29 делится только на 1 и на 29."]],"vysshaya_engineering":[["Алгебра логики","Чему равно A AND 0 для любого значения A?",["0","1","A","NOT A"],0,"AND даёт 1 только тогда, когда оба входа равны 1. Здесь один из входов равен 0, поэтому результат всегда 0 независимо от значения A."],["Физика","Как изменится ток через резистор, если напряжение увеличить в 2 раза, а сопротивление оставить прежним?",["Уменьшится вдвое","Не изменится","Увеличится вдвое","Станет нулём"],2,"Закон Ома: I = U/R. Если сопротивление R не меняется, а напряжение U удваивается, то и результат деления — ток I — удваивается."],["Системы счисления","Сколько различных значений можно закодировать 4 битами?",["4","8","16","32"],2,"Четыре бита дают 2⁴ = 16 комбинаций."],["Электроника","Для чего в простой электрической цепи нужен резистор?",["Ограничивать ток/создавать падение напряжения","Хранить файлы","Излучать Wi-Fi","Измерять время"],0,"Резистор задаёт сопротивление и помогает ограничить ток."],["Логика","Если A=1 и B=0, чему равно A XOR B?",["0","1","2","Не определено"],1,"XOR равен 1, когда входы различаются."]],"step_future":[["Проектирование","Как лучше проверить инженерную гипотезу?",["Сразу объявить её верной","Поставить измеримый эксперимент и записать результаты","Изменить выводы под ожидания","Не фиксировать условия"],1,"Сначала задайте измеримый критерий успеха, затем проведите опыт при записанных условиях и сохраните результаты. Так другие смогут повторить эксперимент и проверить вывод."],["Математика","Последовательность: 2, 6, 18, 54, … Какое следующее число?",["108","126","162","216"],2,"Проверим соседние числа: 6 = 2×3, 18 = 6×3, 54 = 18×3. Значит, правило — умножать на 3; следующее число 54×3 = 162."],["Информатика","Что из перечисленного лучше всего описывает алгоритм?",["Конечная последовательность точных шагов","Любое случайное действие","Только язык программирования","Только устройство компьютера"],0,"Алгоритм — точное описание шагов решения задачи."],["Физика","Какую величину измеряют в ваттах?",["Силу тока","Мощность","Сопротивление","Заряд"],1,"Ватт — единица мощности."],["Исследование","Что важно включить в защиту проекта?",["Только красивую обложку","Цель, метод, результаты и ограничения","Только список оборудования","Только вывод без данных"],1,"Хорошая защита объясняет задачу, способ проверки, результаты и ограничения."]]},"VSOSH_SOLVED_PDF_QUESTIONS":[["Криптография","Какие криптографические примитивы обеспечивают аутентификацию и целостность данных? Выберите полный верный набор.",["HMAC, цифровая подпись и MAC","Только потоковый и блочный шифры","Только хеш-функция","HMAC и обычный потоковый шифр"],0,"Правильно: HMAC, цифровая подпись и MAC. HMAC и MAC проверяют целостность и подлинность сообщения с использованием секретного ключа; цифровая подпись обеспечивает целостность и проверяемую аутентичность автора. Потоковый и блочный шифры прежде всего обеспечивают конфиденциальность, но сами по себе не гарантируют аутентичность. Одна хеш-функция помогает обнаружить изменение при наличии доверенного эталона, но без ключа/подписи не подтверждает автора. Набор из HMAC и потокового шифра неполон."],["TLS","Выберите набор утверждений о TLS, в котором все пункты верны.",["TLS использует только асимметричное шифрование; SSLv3 рекомендован","TLS сочетает асимметрические механизмы и симметричное шифрование; сертификат связывает открытый ключ с именем; в TLS 1.3 удалён RSA key exchange","Самоподписанный сертификат всегда безопасен; TLS использует только симметричное шифрование","Cертификат содержит закрытый ключ сервера; SSLv3 — современный стандарт"],1,"Правильно — второй набор. TLS использует асимметрическую криптографию для аутентификации/согласования параметров и симметрическую для защиты трафика. Сертификат связывает открытый ключ с именем сущности. В TLS 1.3 статический RSA key exchange удалён. Первый вариант неверен: TLS не использует только асимметрическое шифрование, SSLv3 устарел. Третий неверен: самоподписанный сертификат не становится автоматически доверенным. Четвёртый неверен: закрытый ключ не включают в сертификат, SSLv3 не рекомендуется."],["Linux","Какая команда Linux позволяет наблюдать системные вызовы процесса в реальном времени?",["strace","ltrace","gdb","valgrind"],0,"Правильно: strace — трассирует системные вызовы и сигналы процесса. ltrace обычно отслеживает вызовы библиотечных функций. gdb предназначен для отладки и пошагового исследования программы, а не для специализированного потока системных вызовов. valgrind помогает находить ошибки памяти и анализировать выполнение, но не является стандартным ответом для мониторинга системных вызовов."],["Веб-безопасность","Какой механизм браузерной безопасности задаёт, откуда странице разрешено загружать и выполнять скрипты?",["Same-Origin Policy","Content Security Policy (CSP)","CORS","HSTS"],1,"Правильно: Content Security Policy (CSP) позволяет задавать разрешённые источники скриптов и другие ограничения содержимого. Same-Origin Policy ограничивает взаимодействие ресурсов разных origin, но не является списком разрешённых источников скриптов. CORS регулирует кросс-доменные запросы и доступ к ответам. HSTS требует использовать HTTPS для сайта и не управляет источниками JavaScript."],["Хеширование","Сколько байт занимает одно значение SHA-256?",["16 байт","20 байт","32 байта","64 байта"],2,"Правильно: 32 байта. SHA-256 выдаёт 256 бит; 256 ÷ 8 = 32 байта. 16 байт — 128 бит, 20 байт — 160 бит, а 64 байта — 512 бит. Не путайте длину хеша в байтах с его шестнадцатеричной записью: в ней 64 символа."],["Журналирование","Нужно журналировать все попытки подключения к защищённой службе удалённого рабочего стола администратора. Какое правило соответствует этой цели?",["Разрешить журналирование всех входящих попыток к порту службы удалённого рабочего стола, включая успешные и неуспешные","Записывать только успешные подключения и отключить остальные журналы","Журналировать только исходящие DNS-запросы","Полностью запретить журналирование, чтобы не хранить персональные данные"],0,"Правильно: фиксировать все попытки подключения к целевой службе, включая успешные и неуспешные, с временем, источником и результатом. Вариант 2 теряет сведения о неудачных попытках и переборе. DNS-запросы не заменяют журналирование подключений к удалённому рабочему столу. Полный отказ от журналов лишает специалистов возможности расследовать инцидент. В исходном PDF для задания указано требование составить правило; конкретный синтаксис зависит от используемой системы журналирования."],["Комбинаторика","В условии задачи 7 требуется 9 позиций, ровно 3 X, не менее одного Y и не более двух Z. Сколько раскладок удовлетворяет условиям?",["1848","126","1512","2184"],0,"Правильно: 1848 — ответ из официального PDF. X занимает ровно 3 из 9 позиций. Для оставшихся 6 позиций Z встречается 0, 1 или 2 раза, а остальные позиции занимают Y; Y должен встретиться хотя бы раз. Сумма числа размещений равна C(9,3) × (C(6,0)+C(6,1)+C(6,2)) = 84 × (1+6+15) = 1848. 126, 1512 и 2184 не соответствуют этой сумме допустимых размещений."],["Анализ данных","Какой флаг является ответом к заданию «Полимерный контейнер»?",["vsosh{r0t4_b85_n3ur4l_pr0t0c0l_3}","vsosh{idx_ror1_xor5A_ok}","vsosh{plain_ftp_exposes_data}","vsosh{ack_f1l3l34k}"],0,"Правильно: vsosh{r0t4_b85_n3ur4l_pr0t0c0l_3} — официальный ответ к заданию 8. Вариант idx_ror1_xor5A_ok относится к заданию 9 «Пассивный анализ». plain_ftp_exposes_data встречался в другом тренировочном наборе и не является ответом к этому PDF. ack_f1l3l34k указан в PDF как один из допустимых флагов для задания 11, связанного с анализом сетевого трафика."],["Реверс-инжиниринг","Какой ключ нужно восстановить в задании «Пассивный анализ»?",["vsosh{idx_ror1_xor5A_ok}","vsosh{r0t4_b85_n3ur4l_pr0t0c0l_3}","vsosh{xxe_f1l3l34k}","vsosh{tls_certificate_chain}"],0,"Правильно: vsosh{idx_ror1_xor5A_ok} — официальный ответ к заданию 9. r0t4_b85_n3ur4l_pr0t0c0l_3 относится к заданию 8. xxe_f1l3l34k — допустимый флаг из сетевого задания 11. tls_certificate_chain не указан в официальном документе как ответ к этому заданию."],["Подбор пароля","Каково максимальное время перебора пароля длиной 8 символов при заданном алфавите и скорости 2000 паролей/с?",["4 841 325 998 секунд","48 413 259 секунд","484 132 секунд","4 841 секунду"],0,"Правильно: 4 841 325 998 секунд — значение из официального PDF. Алфавит состоит из 26 строчных английских букв, 10 цифр и 6 спецсимволов, всего 42 символа. Пространство вариантов — 42⁸; деление на 2000 попыток в секунду даёт время полного перебора, округлённое до целых, как в ответах. Остальные варианты занижают время на несколько порядков."],["Сетевая аномалия","По анализу трафика из задания 11 определите тип атаки. Дополнительные ответы: IP атакующего — 10.0.1.15; запрошенный путь — etc/passwd; флаг — один из указанных ниже.",["XML External Entity (XXE); vsosh{xxe_f1l3l34k}","SQL injection; vsosh{sql_f1l3l34k}","XSS; vsosh{xss_f1l3l34k}","No attack (valid creds); vsosh{valid_login}"],0,"Правильно: XML External Entity (XXE). По официальному PDF IP атакующего — 10.0.1.15, запрошенный файл — etc/passwd, а допустимый флаг — vsosh{ack_f1l3l34k} или vsosh{xxe_f1l3l34k}. XXE возникает, когда обработчик XML разрешает небезопасное использование внешних сущностей; это может привести к чтению локальных файлов. SQL injection изменяет логику SQL-запроса, XSS связан с выполнением скрипта в браузере, а «No attack» не соответствует обнаруженной аномалии. Альтернативные флаги sql_f1l3l34k, xss_f1l3l34k и valid_login в источнике не указаны."]],"VSOSH_SOLVED_OPTION_EXPLANATIONS":[],"PERECHEN_CHOICES":[["01","Международная олимпиада Иннополис","Технологические и инженерные задачи для школьников, которым интересны IT, робототехника и современные разработки.","innopolis","⌘"],["02","Олимпиада имени И. Я. Верченко","Соревнование для увлечённых информатикой и математикой. Перед участием проверьте доступные классы, профиль и формат этапов.","verchenko","∑"],["03","«Высшая проба» — «Инженерные науки»","Инженерный профиль многопрофильной олимпиады НИУ ВШЭ: подойдёт тем, кто любит решать технические задачи и применять знания на практике.","vysshaya_engineering","⚙"],["04","«Шаг в будущее» — «Инженерное дело»","Профиль для интересующихся инженерными решениями и прикладными проектами. Уточните требования, сроки и формат участия в текущем сезоне.","step_future","⚒"]],"VSOSH_GRADE10_QUESTIONS":[["TLS","Рассмотрим защищённое подключение к веб-сайту https://example.com. Какой криптографический протокол обеспечивает защиту на транспортном уровне?",["SSH","TLS","HTTP","HTCPCP"],1,"Правильный ответ — TLS. Представь, что браузер и сайт договариваются о защищённом «туннеле»: TLS помогает скрыть данные от посторонних и заметить попытку изменить их по дороге. Сам по себе HTTP такой криптографической защиты не даёт."],["Сертификат","Какие данные относятся к сертификату сервера для example.com?",["Открытый ключ","Подпись выдавшего удостоверяющего центра","Домен example.com","Закрытый ключ сервера"],0,"В сертификате публикуется открытый ключ и сведения об имени/владельце, а подпись УЦ позволяет проверить происхождение сертификата. Закрытый ключ сервера в сертификат не передаётся."],["Домены и сертификаты","Какое сопоставление домена и сертификата из задания 3 корректно?",["example.com → сертификат с CN=example.com","auth.example.com → только сертификат *.www.example.com","admin.www.example.com → *.example.com","www.example.com → сертификат только для auth.example.com"],0,"В записи проверяется соответствие имён доменов и расширения subjectAltName. Базовый сертификат для example.com подходит к example.com, а wildcard одного уровня не покрывает произвольное число уровней."],["CSR","Без каких полей Certificate Signing Request (CSR) из видео не будет корректным?",["Открытого ключа запрашивающего","Закрытого ключа запрашивающего","Доменов, для которых нужен сертификат","Подписи запрашивающего"],1,"Закрытый ключ сам в CSR не передаётся. CSR содержит открытый ключ, запрашиваемые имена и подпись, которой владелец доказывает владение соответствующим закрытым ключом."],["Certificate Transparency","Какой порядок выпуска сертификата соответствует заданию 5 из видео?",["Генерация пары ключей → запрос УЦ → публикация пресертификата в CT → получение метки времени CT → выдача сертификата → защищённое соединение","Запрос УЦ → генерация ключей → выдача сертификата → CT → соединение","CT → запрос УЦ → генерация ключей → соединение → сертификат","Выдача сертификата → генерация ключей → CT → запрос УЦ → соединение"],0,"Именно такая последовательность показана в правильном ответе видео: ключи создаются сначала, затем запрос и публикация в CT, после чего сертификат получает клиент и может использоваться для защищённого соединения."],["Веб-код","В показанном фрагменте Flask/SQLite какая строка содержит SQL-инъекционно опасное формирование запроса?",["Строка 12","Строка 16","Строка 19","Строка 26"],2,"В строке 19 значения username и password напрямую вставляются в SQL-строку. Без параметризованных запросов это позволяет вмешаться в структуру SQL-запроса."],["OWASP","Какому риску безопасности по методологии OWASP соответствует показанная уязвимость?",["Injection","Cryptographic Failures","Security Logging and Monitoring Failures","Identification and Authentication Failures"],0,"В условии правильным ответом отмечен Injection: пользовательские данные попадают непосредственно в SQL-запрос."],["FTP","В школьном сценарии сервер выгружает электронный дневник по FTP. Где в скачанных логах находится секретный токен?",["vsosh{plain_ftp_exposes_data}","vsosh{tls_certificate_chain}","vsosh{secure_ftp_only}","vsosh{ct_log_timestamp}"],0,"В условии указан формат флага vsosh{text}; правильный фрагмент — vsosh{plain_ftp_exposes_data}. Смысл задачи: FTP передаёт данные без шифрования, поэтому секрет мог попасть в журнал/перехваченный трафик."],["Инцидент","Какой ID пользователя указан в журнале как ID атакующего в задании 9?",["84351726","76542041","13572468","24681357"],1,"В записи показан повторный вопрос по ID атакующего; после первоначально неверного ответа 84351726 используется ID 76542041. Остальные значения в записи не являются ответом."],["Базы данных","Какую систему управления базами данных использовал сервис, когда в логах было видно 13 потоков информации об окружении сервера?",["MongoDB","MySQL","SQLite","PostgreSQL"],2,"В условии правильный вариант отмечен как SQLite."],["Утечка секрета","Что было прочитано злоумышленником из окружения процесса в задании 11?",["Приватный ключ SSH","Переменные окружения процесса","Только имя пользователя","Только IP-адрес сервера"],1,"В условии среди правильных пунктов отмечено чтение переменных окружения процесса; они могут содержать секреты, токены и другие чувствительные значения."],["Incident Response","Какой порядок этапов реагирования на инцидент соответствует заданию 12?",["Подготовка → обнаружение и анализ → сдерживание → устранение причины → восстановление → разбор инцидента","Восстановление → подготовка → сдерживание → анализ → устранение","Сдерживание → подготовка → восстановление → обнаружение","Анализ → восстановление → подготовка → сдерживание"],0,"Правильный порядок в видео начинается с подготовки, затем обнаружение/анализ, сдерживание, устранение причины, восстановление и итоговый разбор инцидента."],["Сдерживание","В школьной сети обнаружен шифровальщик: один компьютер уже зашифрован, остальные пока работают. Что нужно сделать прямо сейчас?",["Сразу восстановить все компьютеры из резервных копий","Сдержать распространение: изолировать заражённую машину/сегмент","Удалить все журналы","Продолжить работу и дождаться окончания шифрования"],1,"Задание 13 относится к сдерживанию: сначала нужно остановить распространение атаки и изолировать заражённые узлы."],["Этап реагирования","Школу зашифровали, администратор восстановил серверы из резервных копий, но через два дня атака повторилась. Какой этап цикла был пропущен?",["Обнаружение и анализ","Подготовка","Сдерживание","Восстановление"],0,"Если систему просто восстановили, но атака повторилась тем же способом, значит не были качественно разобраны причина и способ проникновения — пропущен этап обнаружения и анализа."],["Подготовка","Какие действия относятся к этапу подготовки, то есть выполняются заранее, до инцидента?",["Назначить ответственных и контакты","Отключить уже заражённые машины","Настроить сбор и хранение журналов","Регулярно проверять, что резервные копии действительно восстанавливаются"],0,"В условии к подготовке отнесены назначение ответственных, настройка журналирования и резервного копирования. Отключение заражённых машин относится уже к реагированию на инцидент."],["Вредоносное ПО","Какой тип вредоносного ПО соответствует описанию: шифрует файлы и требует выкуп за ключ расшифровки?",["Шпионское ПО","Вирус","Логическая бомба","Ransomware / шифровальщик"],3,"Шифровальщик блокирует данные и требует выкуп. Это ransomware."],["Сетевое распространение","Сотрудник скачал «бесплатный ускоритель интернета». После запуска его машина начала рассылать спам, а остальные компьютеры сети остались чистыми. К какому типу относится программа?",["Вирус","Логическая бомба","Троян","Сетевой червь"],0,"В условии правильным вариантом отмечен вирус: заражение началось после запуска пользователем программы. Червь распространяется по сети самостоятельно."],["Сетевая активность","Сервер регулярно отправляет данные на чужой адрес, но ни диспетчер процессов, ни антивирус не п
